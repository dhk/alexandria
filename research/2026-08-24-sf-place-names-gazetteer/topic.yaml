  - id: operator-verification-2026-08-24
    outcome: completed
    role: verification
    note: >-
      No model. Direct retrieval and reading of the 1945 Journal of Proceedings,
      four Assessor's block sheets, the 1988 LA Times article, and the Wikipedia
      revision history. Produced the investigation's strongest findings.

# The observation worth carrying out of this investigation, independent of its
# subject:
#
# The commissioned instrument failed on exactly the material that mattered
# most. It could not read a map image, could not read a scanned municipal
# record, and returned a confident false negative on a document that a footnote
# chase found in minutes. What made the difference was not a better model but a
# different act — following one response's attribution back to its source. A
# research apparatus that only dispatches prompts cannot do that, and this run
# is a clean case of the gap.
