caveats: >
  Single provider, not graded and not cross-checked against another model. No
  claim scoring, no grading model, no claim landscape — this run was not
  dispatched through Alexandria's commission pipeline and carries none of its
  apparatus.

  Five of seven deep-research calls timed out at the MCP client's 300s limit.
  The requests had already been accepted server-side, so they were in all
  likelihood billed without returning anything; the provider returned no usage
  or cost metadata on any call, so per-call cost is unknown and is not recorded
  here rather than being estimated. Raising PERPLEXITY_TIMEOUT_MS is the
  indicated fix — the calls were completing, just past the ceiling.

  The three fast-preset calls are a weaker instrument than the preset they
  replaced, and one of them (response-q3b) returned a false negative: it
  reported the 1945 document unfindable when the document is retrievable and
  was subsequently read. Preserved unedited.
