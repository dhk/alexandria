prompt: >
  Three prompts, one per question, each carrying the operator's seven
  provenance rules as a system prompt and the required Verdict / Evidence /
  What-you-could-not-verify output shape. Q1 and Q3 were each re-issued in a
  shortened form after their full-length dispatch timed out; Q3 was then split
