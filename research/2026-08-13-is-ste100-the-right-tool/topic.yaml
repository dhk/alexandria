# ---- editorial: nothing below here was written by a tool ----
origin: >
  ASD-STE100 is circulating as a general standard for good writing -- in
  writing-tool communities, in AI writing skills, among practitioners adopting
  it for prose it was never designed for. The prior investigation
  (2026-08-12-writing-communication-best-practices) found the claude-writing-skills
  repo's STE skill to be its most standards-grounded component, and separately
  found that nothing in that repo tells a writer which technique to reach for
  -- a missing context router. This brief tests the enthusiasm and fills that
  gap: not "is STE good" but "good for what, and what should be used instead
  when the purpose changes".
claim_under_test: >
  That ASD-STE100 is the right tool for clear, concise, persuasive writing.
  Stated as it circulates, and tested rather than assumed. The models were
  asked to steelman it first -- to state the strongest version of the case
  before examining it -- so that a rejection could not be read as the framing
  of the question leading the answer.
why_now: >
  Two decisions turn on it: what to propose to the claude-writing-skills
  maintainer, and what DHK recommends and practises in his own public writing.
  A recommendation that STE serves all clear writing is only sound if its
  design goals match the writer's purpose; where they diverge, something has
  to say what to use instead.
scope: >
  Deliberately excluded: any source audit. Web search was off, so every
  citation here is model recall -- specific enough to check (Chervak & Drury;
  Sopory & Dillard 2002; Green & Brock 2000; Kincaid et al. 1975; Pullum 2009;
  Kuhn 2014) and unchecked. Two of three models supplied STE's founding
  lineage; the third declined to assert it from the supplied materials, and
  nobody has established which was right. Also out of scope: implementing a
  context router, rewriting the STE skill, and any empirical work of our own.

