headline: "A narrow script-first workflow is worth validating, but the market gap is not established"
consensus: "Three models favored merge-triggered repo analysis plus a short human interview and a provenance-bearing demo specification; agreement is directional, not factual validation."
disagreement: "No material disagreement on MVP shape; models differed mainly in the specificity of prior-art and implementation suggestions."
