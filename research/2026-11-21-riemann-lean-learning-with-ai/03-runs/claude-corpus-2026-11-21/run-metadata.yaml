caveats: >
  Single model, not graded, and not cross-checked against another model.
  Conflict of interest: the corpus was assembled by Claude about a result
  produced with Claude by an Anthropic employee, and some of the verification
  it reports was itself run with Claude Code. The statement check rests on
  reading Mathlib's source at tag v4.33.1 and on other people's reported
  comparator and kernel runs. This run did not execute Lean. The verification
  status is a snapshot. As of the MIT status page's 12:55 UTC update on
  21 November, the default-kernel and paranoid-kernel replays of the 62 GB
  export and the end-to-end lake comparator were still running. Quotes from
  the Science article came from a corrupted text extraction and are flagged in
  the files. Some historical details in 06 are marked "from memory; verify".
  Those are recalled, not fetched.
