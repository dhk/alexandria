# ---- editorial: nothing below here was written by a tool ----
origin: >
  DHK builds Claude skills and writes publicly using a git-native skills
  workflow, and found nonatofabio/claude-writing-skills -- three skills (ste,
  plainspoken, humanize) encoding writing advice. He wanted to approach its
  maintainer with proposed extensions, and wanted the proposal to rest on the
  literature rather than on his own taste in prose. Hence the brief's ordering
  constraint: establish the external evidence first, and only then look at the
  tool.
claim_under_test: >
  That the three skills implement recognised written-communication best
  practice; that where they diverge from it the divergence is specific enough
  to name; and that the gaps are concrete enough to propose as extensions tied
  to cited findings rather than to opinion. The models were asked to establish
  the standard before applying it, so that the critique could not be
  reverse-engineered from the artifact being critiqued.
why_now: >
  The proposal is meant as a collaboration with the repo's maintainer, and an
  unsupported critique of someone's published work is not a collaboration. The
  AI-text strand is also moving fast enough that a synthesis has a short shelf
  life -- the detectability and reader-trust literature is actively contested,
  which is part of why the web-search run is kept alongside the offline one.
scope: >
  Deliberately excluded: any source audit. The scores record what each model
  stated and quote the span it was stated in; nobody has checked that the cited
  sources say what the models say they say, which is the difference between
  Silver and Gold here. Also out of scope: implementing any proposed extension,
  forking the repo, evaluating its code or packaging as software, and
  non-English writing practice -- the brief asks about English
  controlled-language and plain-language standards specifically.
