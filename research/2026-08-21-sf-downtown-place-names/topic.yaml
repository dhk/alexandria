notes: >
  Two briefs; one single-source retrieval probe, no commissioned findings. The operator supplied a multi-phase project
  brief for a San Francisco historical place-names gazetteer; the
  research-bearing sections of it were extracted and split into two
  independent commissions — A for breadth across the pilot name list,
  B for depth on the five contested cases plus the event chronology.
  Commission A was dispatched with web search enabled and never
  returned; its run record orphaned on the host and cannot be recovered
  from the corpus side. Commission B was drafted and deliberately not
  dispatched pending diagnosis of the host. Neither brief has been
  answered by any model as a commission. A hand-run retrieval probe
  (03-runs/claude-probe-2026-08-25/) has since established what the open
  web can and cannot settle, obtained one substantive primary
  administrative source, and opened the conflict register with a
  disagreement over the 100 Vara District's extent. It is one source and
  is not graded. The briefs are committed here because they are
  the durable artifact of the session and Alexandria is where research
  artifacts live; the run record is not committed, because local run
  records belong to Minority Report per CONTRIBUTING.md.

scope: >
  Deliberately excluded from both briefs: the Phase 0-5 execution plan,
  GitHub repository structure, JSON record schemas, Git workflow, and
  definition-of-done checklist from the source brief. Those instruct an
  execution agent how to build and govern a repository and are not
  research questions; sending them to research models would have
  produced project plans rather than findings. Also excluded: the
  full-city scope (1835-present, all of San Francisco) — both briefs
  are restricted to the downtown/SoMa pilot from 1847.

limitations: >
  Web search was to be on for both runs, which would have made neither
  reproducible: a searching run rests on pages as they read that day.
  The rationale accepted at commission time was that the deliverable is
  a source registry whose entire value is whether its citations survive
  checking, and that offline recall of 1850s cartography and directory
  citations produces specific, plausible, unverifiable references. That
  tradeoff was chosen deliberately and should be re-examined rather than
  inherited if these briefs are dispatched later.
