prompt: >
  Test whether the open web can answer the retrieval-shaped questions in the
  two briefs — chiefly The East Cut's adoption and the first print appearance
  of "SoMa" and "South of the Slot" — before paying for a multi-model
  commission. Run as a probe, not as an answer to either brief.
caveats: >
  Single source, not graded, not cross-checked against another model, and not
  an answer to either brief. Page retrieval is governed by an egress domain
  allowlist by host, not by content class: theeastcut.org, sfist.com,
  en.wikipedia.org, sfgate.com, www.sfheritage.org and archives.sfplanning.org
  were all blocked, while sfplanning.s3.amazonaws.com was reachable — SF
  Planning is both blocked and reachable depending on which host serves the
  file. The East Cut
  findings therefore rest entirely on search-engine summaries whose underlying
  pages were never read, and are marked SEARCH-SUMMARY rather than FETCHED —
  a marker the briefs do not define, introduced here because conflating it
  with either FETCHED or RECALLED would misrepresent the evidence. The one
  document actually read is a 2009 synthesis: its claims about the 1850s are
  retrospective commentary inheriting whatever its footnotes rest on.
  No Sanborn sheet, block book, city directory or newspaper database was
  consulted.
