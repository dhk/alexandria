# ---- editorial: nothing below here was written by a tool ----
origin: >
  The first two investigations in this series examined writing standards
  against the literature and against each other. Neither covered the setting
  where most professional writing actually happens: inside an organization,
  where every genre is a decision genre and the reader has a stake, often
  power, and sometimes a grievance. DHK named six genres he writes; three more
  were added on analysis (splitting incident notification from postmortem,
  adding decision records, dissent and reference documentation) and status
  updates were added at his insistence after being wrongly cut.
claim_under_test: >
  That clear writing is clear writing -- that one set of principles serves
  organizational communication whatever its purpose. Rejected. The replacement
  is a demand profile per genre and a supply profile per technique, matched
  rather than asserted.
why_now: >
  The prior run found that the tools in this space share an assumption --
  surface features proxy quality -- valid as a diagnostic and invalid as a
  target. Organizational writing is where that failure has consequences: a
  status update optimised for confidence is how a project stays green until
  the week it ships. The output feeds a proposal to the claude-writing-skills
  maintainer and DHK's own practice.
scope: >
  Deliberately excluded: externally-facing communication -- customer notices,
  status pages, regulatory filings -- where legal and disclosure constraints
  need their own brief rather than a row in a table. Also excluded:
  performance and promotion writing, where norms are too institution-specific
  to transfer, and any source audit. Web search was on, so citations are model
  retrieval, unverified by a human.

