# Two limitations that matter more than usual here.
#
# The grader observed, unprompted, that "the degree of agreement on individual
# claims is unusually high, suggesting the source materials strongly constrain
# the conclusions". The ablation r-2026-0814-01 settled it, and the answer is
# split: the commitment-versus-calibration defect survived removal of the
# framing, found independently by all three models from the skill's own text,
# while the SEVERITY did not -- three confidence-calibration cells swung by up
# to three points. The defect is in the material; the scores were the brief's.
#
# The claim landscape records zero disagreements while the synthesised matrices
# show ten contested cells. Claim extraction cannot represent a disagreement
# about degree, only about direction.
