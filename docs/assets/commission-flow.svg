<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How a brief becomes a checkable record</title>
  <desc id="desc">A research brief is priced by begin_research, which calls no model. It then crosses an explicit review gate the operator must confirm before any spend. Past the gate the work runs either as a commissioned multi-model run with a grader, or as a single-source read where one session reads the documents itself. Both produce evidence carrying its own provenance marker, and both are promoted deliberately into the Alexandria corpus.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#155eef"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#155eef;stroke-width:3}.gate{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.h{font:700 34px system-ui,sans-serif;fill:#0f172a}.hsmall{font:700 30px system-ui,sans-serif;fill:#0f172a}.t{font:500 24px system-ui,sans-serif;fill:#334155}.s{font:600 20px ui-monospace,monospace;fill:#475569}.line{stroke:#155eef;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h" x="800" y="75" text-anchor="middle">How a brief becomes a checkable record</text>

  <rect class="panel" x="50" y="330" width="250" height="220" rx="18"/>
  <text class="hsmall" x="175" y="395" text-anchor="middle">Research brief</text>
  <text class="t" x="175" y="450" text-anchor="middle">the question,</text><text class="t" x="175" y="485" text-anchor="middle">scoped</text>

  <rect class="accent" x="345" y="330" width="290" height="220" rx="18"/>
  <text class="hsmall" x="490" y="395" text-anchor="middle">begin_research</text>
  <text class="t" x="490" y="450" text-anchor="middle">prices the run</text><text class="t" x="490" y="485" text-anchor="middle">against live rates</text>
  <text class="s" x="490" y="530" text-anchor="middle">calls no model</text>

  <rect class="gate" x="680" y="330" width="210" height="220" rx="18"/>
  <text class="hsmall" x="785" y="395" text-anchor="middle">Review</text>
  <text class="t" x="785" y="450" text-anchor="middle">estimate shown</text><text class="t" x="785" y="485" text-anchor="middle">operator confirms</text>
  <text class="s" x="785" y="530" text-anchor="middle">phrase required</text>

  <rect class="accent" x="935" y="150" width="320" height="200" rx="18"/>
  <text class="hsmall" x="1095" y="212" text-anchor="middle">run_research</text>
  <text class="t" x="1095" y="263" text-anchor="middle">several models,</text><text class="t" x="1095" y="298" text-anchor="middle">answered blind</text>
  <text class="s" x="1095" y="334" text-anchor="middle">graded, compared</text>

  <rect class="accent" x="935" y="530" width="320" height="200" rx="18"/>
  <text class="hsmall" x="1095" y="592" text-anchor="middle">single-source read</text>
  <text class="t" x="1095" y="643" text-anchor="middle">one session reads</text><text class="t" x="1095" y="678" text-anchor="middle">the documents itself</text>
  <text class="s" x="1095" y="714" text-anchor="middle">fetched, not recalled</text>

  <rect class="panel" x="1300" y="330" width="250" height="220" rx="18"/>
  <text class="hsmall" x="1425" y="395" text-anchor="middle">Alexandria</text>
  <text class="t" x="1425" y="450" text-anchor="middle">marked evidence,</text><text class="t" x="1425" y="485" text-anchor="middle">versioned in git</text>
  <text class="s" x="1425" y="530" text-anchor="middle">the record</text>

  <path class="line" d="M300 440H340"/>
  <path class="line" d="M635 440H675"/>
  <path class="line" d="M890 440H912V250H930"/>
  <path class="line" d="M890 440H912V630H930"/>
  <path class="line" d="M1255 250H1277V435H1295"/>
  <path class="line" d="M1255 630H1277V445H1295"/>
  <text class="s" x="1276" y="405" text-anchor="middle">promote</text>

  <text class="t" x="800" y="805" text-anchor="middle">Nothing dispatches until the operator supplies the confirmation phrase. Both paths mark their own provenance.</text>
</svg>
