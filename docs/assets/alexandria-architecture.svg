<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Alexandria and Minority Report repository boundary</title>
  <desc id="desc">Replaceable operator tools and providers feed Minority Report. Candidate artifacts cross an explicit human review and promotion boundary into Alexandria's durable governed corpus.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#155eef"/></marker>
    <style>
      .bg{fill:#f8fafc}.panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.accent{fill:#eff6ff;stroke:#155eef;stroke-width:3}.gate{fill:#fff7ed;stroke:#ea580c;stroke-width:3}.h{font:700 34px system-ui,sans-serif;fill:#0f172a}.hsmall{font:700 30px system-ui,sans-serif;fill:#0f172a}.t{font:500 24px system-ui,sans-serif;fill:#334155}.s{font:600 20px ui-monospace,monospace;fill:#475569}.line{stroke:#155eef;stroke-width:5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect class="bg" width="1600" height="900"/>
  <text class="h" x="800" y="75" text-anchor="middle">Two repositories, one reviewable research trail</text>
  <rect class="panel" x="80" y="150" width="300" height="560" rx="18"/>
  <text class="hsmall" x="230" y="210" text-anchor="middle">Replaceable inputs</text>
  <text class="t" x="230" y="290" text-anchor="middle">MCP clients</text><text class="t" x="230" y="345" text-anchor="middle">Web surface</text><text class="t" x="230" y="400" text-anchor="middle">Provider APIs</text><text class="t" x="230" y="455" text-anchor="middle">Local configuration</text>
  <text class="s" x="230" y="620" text-anchor="middle">credentials stay local</text>
  <rect class="accent" x="480" y="150" width="390" height="560" rx="18"/>
  <text class="h" x="675" y="210" text-anchor="middle">Minority Report</text>
  <text class="t" x="675" y="285" text-anchor="middle">orchestration + grading</text><text class="t" x="675" y="340" text-anchor="middle">provider adapters</text><text class="t" x="675" y="395" text-anchor="middle">MCP + web surfaces</text><text class="t" x="675" y="450" text-anchor="middle">local run records</text><text class="t" x="675" y="505" text-anchor="middle">packaging + host ops</text>
  <text class="s" x="675" y="620" text-anchor="middle">candidate artifacts</text>
  <rect class="gate" x="940" y="300" width="220" height="260" rx="18"/>
  <text class="h" x="1050" y="365" text-anchor="middle">Review</text><text class="t" x="1050" y="425" text-anchor="middle">rights</text><text class="t" x="1050" y="470" text-anchor="middle">privacy</text><text class="t" x="1050" y="515" text-anchor="middle">promotion</text>
  <rect class="panel" x="1230" y="150" width="300" height="560" rx="18"/>
  <text class="h" x="1380" y="210" text-anchor="middle">Alexandria</text>
  <text class="t" x="1380" y="285" text-anchor="middle">evidence + lifecycle</text><text class="t" x="1380" y="340" text-anchor="middle">schemas + policy</text><text class="t" x="1380" y="395" text-anchor="middle">provenance</text><text class="t" x="1380" y="450" text-anchor="middle">analysis + synthesis</text><text class="t" x="1380" y="505" text-anchor="middle">governance + history</text>
  <text class="s" x="1380" y="620" text-anchor="middle">durable corpus</text>
  <path class="line" d="M380 430H465"/><path class="line" d="M870 430H925"/><path class="line" d="M1160 430H1215"/>
  <text class="t" x="800" y="805" text-anchor="middle">Tooling can change without rewriting the reviewed evidence trail.</text>
</svg>
