name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: validate (repository root)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --frozen python scripts/validate.py

# templates/mcp-server's own CI job moved to dhk/minority-report along with
# the template itself — see https://github.com/dhk/alexandria/issues/33.
